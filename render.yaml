# Render Blueprint — https://render.com/docs/blueprint-spec
databases:
  - name: vetra-db
    databaseName: vetra
    user: vetra
    plan: free
    region: frankfurt

services:
  - type: web
    name: vetra
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: vetra-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: PLATFORM_USERNAME
        value: admin
      - key: PLATFORM_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
